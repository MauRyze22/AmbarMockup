{% extends 'restaurante/base.html' %}

{% block title %}Reservar mesa — Ámbar{% endblock %}

{% block content %}
<section class="section">
  <div class="wrap">
    <div class="form-card">
      <p class="eyebrow">Mesa asegurada</p>
      <h2>Reserva tu mesa</h2>
      <p class="lead">Elige el servicio y cuántos son — te mostraremos los horarios disponibles.</p>

      <form method="GET" action="{% url 'reserva_create_1' %}">
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Continuar</button>
      </form>
    </div>
  </div>
</section>
{% endblock %}
